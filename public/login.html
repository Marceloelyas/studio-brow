<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Studio Brow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="login-page">

<main class="login-card">
  <a href="/" class="brand brand--center">
    <span class="brand__mark">SB</span>
    <span class="brand__name">Studio&nbsp;Brow</span>
  </a>

  <h1>Área do designer</h1>
  <p class="muted">Entre com suas credenciais para acessar o painel.</p>

  <form id="loginForm" class="form" novalidate>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required placeholder="voce@studiobrow.com">
      <small class="error" data-error-for="email"></small>
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••">
      <small class="error" data-error-for="password"></small>
    </div>

    <button type="submit" class="btn btn--primary btn--block" id="loginBtn">
      Entrar
    </button>

    <p class="form__status" id="loginStatus" role="status"></p>
  </form>

  <p class="muted small center">
    <a href="/">← Voltar ao site</a>
  </p>
</main>

<script>
const form = document.getElementById('loginForm');
const status = document.getElementById('loginStatus');
const btn = document.getElementById('loginBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  status.textContent = '';
  status.className = 'form__status';

  const email = form.email.value.trim();
  const password = form.password.value;

  let ok = true;
  document.querySelectorAll('.error').forEach(el => el.textContent = '');

  if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
    document.querySelector('[data-error-for="email"]').textContent = 'E-mail inválido';
    ok = false;
  }
  if (!password || password.length < 6) {
    document.querySelector('[data-error-for="password"]').textContent = 'Mínimo 6 caracteres';
    ok = false;
  }
  if (!ok) return;

  btn.disabled = true;
  btn.textContent = 'Entrando…';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password }),
    });

    if (!res.ok) throw new Error('Credenciais inválidas');

    window.location.href = '/dashboard.html';
  } catch (err) {
    status.textContent = err.message;
    status.classList.add('is-error');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>

</body>
</html>
