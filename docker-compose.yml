services:
  db:
    image: postgres:16-alpine
    container_name: studio_brow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio123
      POSTGRES_DB: studio_brow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio_brow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: studio_brow_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://studio:studio123@db:5432/studio_brow
      SESSION_SECRET: troque-esta-chave-em-producao
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
